AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UrbanGuard AI System - Serverless Deployment

# ============================================================================
# Global Configuration
# ============================================================================
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        DYNAMODB_TABLE_COMPLAINTS: !Ref ComplaintsTable
        DYNAMODB_TABLE_RISK_ZONES: !Ref RiskZonesTable
        DYNAMODB_TABLE_REPORTS: !Ref DailyReportsTable
        DYNAMODB_TABLE_USERS: !Ref UsersTable
        OPENWEATHERMAP_API_KEY: !Ref OpenWeatherMapApiKey
        AWS_BEDROCK_REGION: !Ref AWS::Region
        SNS_ALERT_TOPIC_ARN: !Ref AlertTopic
        SQS_COMPLAINT_QUEUE_URL: !Ref ComplaintQueue
        S3_BUCKET_NAME: !Ref DataBucket

# ============================================================================
# Parameters
# ============================================================================
Parameters:
  OpenWeatherMapApiKey:
    Type: String
    Description: OpenWeatherMap API key for weather data integration
    NoEcho: true
    Default: ''
  
  Environment:
    Type: String
    Description: Deployment environment (dev, staging, prod)
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  AlertEmail:
    Type: String
    Description: Email address to receive SNS risk alerts (optional)
    Default: ''

# ============================================================================
# Conditions
# ============================================================================
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

# ============================================================================
# Resources
# ============================================================================
Resources:
  
  # ==========================================================================
  # Lambda Function
  # ==========================================================================
  UrbanGuardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub urbanguard-api-${Environment}
      Description: UrbanGuard AI System FastAPI backend
      CodeUri: .
      Handler: lambda_handler.lambda_handler
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ComplaintsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RiskZonesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ComplaintQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AlertTopic
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt ComplaintQueue.Arn
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !GetAtt UrbanGuardLogGroup.Arn
      Events:
        # Root endpoint
        RootApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /
            Method: GET
        
        # Health check endpoint
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /health
            Method: GET
        
        # Complaint submission endpoint
        ReportComplaintApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /report-complaint
            Method: POST
        
        # Get all complaints endpoint
        GetComplaintsApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /complaints
            Method: GET
        
        # Get clusters endpoint
        GetClustersApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /clusters
            Method: GET
        
        # Get risk hotspots endpoint
        GetRiskHotspotsApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /risk-hotspots
            Method: GET
        
        # Get daily report endpoint
        GetDailyReportApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /daily-report
            Method: GET
        
        # Get weather endpoint
        GetWeatherApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /weather
            Method: GET
        
        # Get traffic endpoint
        GetTrafficApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /traffic
            Method: GET
        
        # Get predictions endpoint
        GetPredictionsApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /predictions
            Method: GET
        
        # Auth - signup endpoint
        AuthSignupApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /api/v1/auth/signup
            Method: POST
        
        # Auth - login endpoint
        AuthLoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /api/v1/auth/login
            Method: POST
        
        # Auth - me endpoint
        AuthMeApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /api/v1/auth/me
            Method: GET
        
        # Catch-all proxy for all other /api/v1/* routes
        ApiV1ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref UrbanGuardApi
            Path: /api/v1/{proxy+}
            Method: ANY

        # SQS trigger for async complaint processing
        ComplaintQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ComplaintQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

        # EventBridge scheduled rule — daily report at 06:00 IST (00:30 UTC)
        DailyReportSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 0 * * ? *)
            Description: Generate daily civic risk report at 06:00 IST
  
  # ==========================================================================
  # API Gateway
  # ==========================================================================
  UrbanGuardApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub urbanguard-api-${Environment}
      StageName: !Ref Environment
      TracingEnabled: false
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,OPTIONS'"
        MaxAge: "'600'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: 'OFF'
          DataTraceEnabled: false
          MetricsEnabled: false
  
  # ==========================================================================
  # S3 Bucket — BBMP datasets, daily reports, BBMP insights cache
  # ==========================================================================
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub urbanguard-data-${Environment}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: UrbanGuard

  # ==========================================================================
  # SNS Topic — High-risk zone alerts and daily report notifications
  # ==========================================================================
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub urbanguard-alerts-${Environment}
      DisplayName: UrbanGuard Risk Alerts
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: UrbanGuard

  # Email subscription — set AlertEmail parameter to subscribe
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ==========================================================================
  # SQS Queue — Async complaint processing (decouples submission from AI)
  # ==========================================================================
  ComplaintQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub urbanguard-complaints-${Environment}
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400  # 24 hours
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ComplaintDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: UrbanGuard

  ComplaintDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub urbanguard-complaints-dlq-${Environment}
      MessageRetentionPeriod: 604800  # 7 days
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================================
  # CloudWatch Alarms
  # ==========================================================================
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub urbanguard-lambda-errors-${Environment}
      AlarmDescription: Lambda function error rate too high
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref UrbanGuardApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub urbanguard-lambda-throttles-${Environment}
      AlarmDescription: Lambda function being throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref UrbanGuardApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub urbanguard-dlq-depth-${Environment}
      AlarmDescription: Complaints failing to process (DLQ has messages)
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ComplaintDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  # ==========================================================================
  # DynamoDB Tables
  # ==========================================================================
  
  # Complaints Table
  ComplaintsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub urbanguard-complaints-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: complaint_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: complaint_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: timestamp-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: UrbanGuard
  
  # Risk Zones Table
  RiskZonesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub urbanguard-risk-zones-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: zone_id
          AttributeType: S
        - AttributeName: risk_level
          AttributeType: S
        - AttributeName: risk_score
          AttributeType: N
      KeySchema:
        - AttributeName: zone_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: risk-score-index
          KeySchema:
            - AttributeName: risk_level
              KeyType: HASH
            - AttributeName: risk_score
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: UrbanGuard
  
  # Daily Reports Table
  DailyReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub urbanguard-reports-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
        - AttributeName: date
          AttributeType: N
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: UrbanGuard
  
  # Users Table (Account Storage)
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub urbanguard-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: UrbanGuard

  # ==========================================================================
  # Cognito User Pool (Authentication)
  # ==========================================================================
  UrbanGuardUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub urbanguard-users-${Environment}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
      UsernameAttributes:
        - email

  UrbanGuardUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UrbanGuardUserPool
      ClientName: !Sub urbanguard-client-${Environment}
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # ==========================================================================
  # CloudWatch Log Groups
  # ==========================================================================
  
  # Lambda Function Logs
  UrbanGuardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/urbanguard-api-${Environment}
      RetentionInDays: 30
  
  # API Gateway Logs
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/urbanguard-api-${Environment}
      RetentionInDays: 30

# ============================================================================
# Outputs
# ============================================================================
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${UrbanGuardApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl
  
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt UrbanGuardApiFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaFunctionArn
  
  ComplaintsTableName:
    Description: DynamoDB Complaints table name
    Value: !Ref ComplaintsTable
    Export:
      Name: !Sub ${AWS::StackName}-ComplaintsTable
  
  RiskZonesTableName:
    Description: DynamoDB Risk Zones table name
    Value: !Ref RiskZonesTable
    Export:
      Name: !Sub ${AWS::StackName}-RiskZonesTable
  
  DailyReportsTableName:
    Description: DynamoDB Daily Reports table name
    Value: !Ref DailyReportsTable
    Export:
      Name: !Sub ${AWS::StackName}-DailyReportsTable
  
  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref UrbanGuardApi
    Export:
      Name: !Sub ${AWS::StackName}-ApiGatewayId

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UrbanGuardUserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UrbanGuardUserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  UsersTableName:
    Description: DynamoDB Users table name
    Value: !Ref UsersTable
    Export:
      Name: !Sub ${AWS::StackName}-UsersTable

  SNSAlertTopicArn:
    Description: SNS topic ARN for risk alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlertTopicArn

  SQSComplaintQueueUrl:
    Description: SQS queue URL for async complaint processing
    Value: !Ref ComplaintQueue
    Export:
      Name: !Sub ${AWS::StackName}-ComplaintQueueUrl

  S3DataBucketName:
    Description: S3 bucket for BBMP data and reports
    Value: !Ref DataBucket
    Export:
      Name: !Sub ${AWS::StackName}-DataBucket
