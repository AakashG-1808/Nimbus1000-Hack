version = 0.1

[default]
[default.global.parameters]
stack_name = "urbanguard-ai-system"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "Environment=dev OpenWeatherMapApiKey="

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Production configuration
[prod]
[prod.deploy.parameters]
stack_name = "urbanguard-ai-system-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "Environment=prod OpenWeatherMapApiKey="

# Staging configuration
[staging]
[staging.deploy.parameters]
stack_name = "urbanguard-ai-system-staging"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "Environment=staging OpenWeatherMapApiKey="
